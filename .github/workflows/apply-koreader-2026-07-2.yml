name: Apply KOReader 2026.07.2 update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-koreader-2026-07-2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply source and documentation updates
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          quick = Path('plugins/burrow.koplugin/internal_patches/2-quick-settings.lua')
          text = quick.read_text(encoding='utf-8')
          text = text.replace('_("Reading controls")', '_("Reading Controls")')
          text = text.replace('_("Quick settings")', '_("Quick Settings")')
          quick.write_text(text, encoding='utf-8')

          main = Path('plugins/burrow.koplugin/main.lua')
          text = main.read_text(encoding='utf-8')
          text = text.replace('require("burrow_ui_text")\n', '')
          main.write_text(text, encoding='utf-8')

          version = Path('plugins/burrow.koplugin/burrow_version.lua')
          text = version.read_text(encoding='utf-8')
          text = text.replace('Burrow is tested against KOReader 2026.07.1.', 'Burrow is tested against KOReader 2026.07.2.')
          text = text.replace('LAST_TESTED_KOREADER = "2026.07.1"', 'LAST_TESTED_KOREADER = "2026.07.2"')
          text = text.replace('LAST_TESTED_KOREADER_NORMALIZED = 202607010000', 'LAST_TESTED_KOREADER_NORMALIZED = 202607020000')
          version.write_text(text, encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'Burrow requires **KOReader 2026.07.1 or newer** and was last tested with **KOReader 2026.07.1**. Newer releases and nightlies may show a compatibility warning while testing continues.',
              'Burrow requires **KOReader 2026.07.1 or newer** and has been tested successfully with **KOReader 2026.07.2**. Newer releases and nightlies may show a compatibility warning while testing continues.'
          )
          readme.write_text(text, encoding='utf-8')

          install = Path('INSTALL.txt')
          text = install.read_text(encoding='utf-8')
          text = text.replace('Last tested KOReader version: 2026.07.1', 'Last tested KOReader version: 2026.07.2')
          install.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          marker = '## [Unreleased]\n'
          addition = '''## [Unreleased]\n\n### Changed\n\n- Updated the last-tested KOReader version to 2026.07.2\n\n### Fixed\n\n- Capitalized the Reading Controls and Quick Settings panel titles\n'''
          if 'Capitalized the Reading Controls and Quick Settings panel titles' not in text:
              text = text.replace(marker, addition, 1)
          changelog.write_text(text, encoding='utf-8')
          PY

          rm -f plugins/burrow.koplugin/burrow_ui_text.lua
          git rm .github/workflows/apply-koreader-2026-07-2.yml

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find plugins/burrow.koplugin -type f -name '*.lua' -print0)

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md INSTALL.txt CHANGELOG.md plugins/burrow.koplugin
          git commit -m "Support KOReader 2026.07.2"
          git push

      - name: Build and verify release package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/package.sh
          archive="$(find dist -maxdepth 1 -name 'Burrow-*.zip' -print -quit)"
          checksum="$(find dist -maxdepth 1 -name 'Burrow-*.sha256' -print -quit)"
          test -n "$archive"
          test -n "$checksum"
          unzip -t "$archive"
          (cd dist && sha256sum -c "$(basename "$checksum")")

      - name: Refresh GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' plugins/burrow.koplugin/burrow_version.lua | head -n 1)"
          tag="v$version"
          sha="$(git rev-parse HEAD)"

          git tag -fa "$tag" "$sha" -m "Burrow $version"
          git push origin "refs/tags/$tag" --force

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Burrow $version" --latest --prerelease=false
          else
            gh release create "$tag" --title "Burrow $version" --generate-notes --latest
          fi

          gh release upload "$tag" dist/Burrow-*.zip dist/Burrow-*.sha256 --clobber
