name: Finalize Burrow 0.4.4-beta.3

on:
  push:
    branches:
      - agent/0.4.4-beta.3-kindle-inversion-fix

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Guard exact beta.2 base and staged chunks
        shell: bash
        run: |
          set -euo pipefail
          base=d8f0f49e624c356cc6186419d3379df8ffbdc691
          git merge-base --is-ancestor "$base" HEAD
          mapfile -t staged < <(git diff --name-only "$base" HEAD | sort)
          expected=(
            .github/__beta443_parts/part00
            .github/__beta443_parts/part01
            .github/__beta443_parts/part02
            .github/__beta443_parts/part03
            .github/__beta443_parts/part04
            .github/__beta443_parts/part05
            .github/workflows/__beta443-finalize.yml
          )
          test "${#staged[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${staged[$i]}" = "${expected[$i]}"; done

      - name: Verify and reconstruct exact reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          echo 'dd5ce77b8c5263eb56c17354164ccd96ecfe5306a36e5a6fe3350a9e960540f9  .github/__beta443_parts/part00' | sha256sum -c -
          echo '89466a05a631a12c7b3fc7a2d55f75bb0c25bb4c174bf347061e1bd561e907c5  .github/__beta443_parts/part01' | sha256sum -c -
          echo 'a7f342cb330de4a7bbd43d9fe6bcc0a221de5d2128875efb426daf2dad9c4bc2  .github/__beta443_parts/part02' | sha256sum -c -
          echo '276897f6b35a90d8f4b344aeef13e210b3e0b9c38c393f314fb9e2dcb9c8164b  .github/__beta443_parts/part03' | sha256sum -c -
          echo '1063e521e109216c211d45dcfb512f052984ab436b994fef9ea3b90356ecb2d7  .github/__beta443_parts/part04' | sha256sum -c -
          echo '8ed85332b2876dc3c293b4c862e95746a947f497c8be645edf49cd486a78905c  .github/__beta443_parts/part05' | sha256sum -c -
          cat .github/__beta443_parts/part* > /tmp/beta443.b64
          base64 -d /tmp/beta443.b64 > /tmp/beta443.tar.gz
          echo '97681abe72f20bd37d7aa8947a0d01dcd654ec0031323c1e20fb74be7e2492bd  /tmp/beta443.tar.gz' | sha256sum -c -
          tar -xzf /tmp/beta443.tar.gz
          rm -rf .github/__beta443_parts
          rm .github/workflows/__beta443-finalize.yml

      - name: Verify exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          base=d8f0f49e624c356cc6186419d3379df8ffbdc691
          mapfile -t changed < <(git diff --name-only "$base" -- | sort)
          expected=(
            plugins/burrow.koplugin/burrow_settings.lua
            plugins/burrow.koplugin/burrow_soft_palette_epub.lua
            plugins/burrow.koplugin/burrow_version.lua
            plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
            plugins/burrow.koplugin/internal_patches/2-kindle-night-sync.lua
            plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua
          )
          test "${#changed[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done

          test "$(git hash-object plugins/burrow.koplugin/burrow_settings.lua)" = 'c25406fd1871969d378a83f433bf134bb96264b0'
          test "$(git hash-object plugins/burrow.koplugin/burrow_soft_palette_epub.lua)" = '9b36ebd42e23b10d033e813390a5934235879b6a'
          test "$(git hash-object plugins/burrow.koplugin/burrow_version.lua)" = '64b8268b634fa175dfb219c1fe8708a10e2db527'
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua)" = '5135675dde4118f8da57867f5d7a4edf24ffb6a3'
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-kindle-night-sync.lua)" = '642e4e25d64bc20488a6ed093b7f335f6d332f26'
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua)" = '4b5caf778e62e4e0bee3652825efcf09fc7591a5'

          grep -Fq 'VERSION = "0.4.4-beta.3"' plugins/burrow.koplugin/burrow_version.lua
          grep -Fq 'DISPLAY_VERSION = "0.4.4-beta.3"' plugins/burrow.koplugin/burrow_version.lua
          grep -Fq 'TJSAMP_GRAY' plugins/burrow.koplugin/burrow_soft_palette_epub.lua
          grep -Fq 'safe_svg' plugins/burrow.koplugin/burrow_soft_palette_epub.lua

          ornament=plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          ! grep -Eq 'reloadDocument|DeviceListener|drawCurrentView|_nightmode_images|setNightmodeImages|Screen\.night_mode' "$ornament"
          sync=plugins/burrow.koplugin/internal_patches/2-kindle-night-sync.lua
          ! grep -Fq 'saveSetting(' "$sync"
          ! grep -Fq 'toggleNightMode(' "$sync"
          ! grep -Eq 'Screen\.night_mode[[:space:]]*=[^=]' "$sync"
          ! grep -Eq 'Device\.orig_hw_nightmode[[:space:]]*=' "$sync"
          grep -Fq 'Device:isKindle()' "$sync"
          grep -Fq 'Device:canHWInvert()' "$sync"
          grep -Fq 'Device:canModifyFBInfo()' "$sync"
          grep -Fq 'Screen.setHWNightmode' "$sync"
          grep -Fq 'Screen.getHWNightmode' "$sync"

      - name: Check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          count=0
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
            count=$((count + 1))
          done < <(find plugins/burrow.koplugin -type f -name '*.lua' -print0)
          test "$count" -eq 91

      - name: Commit exact beta.3 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Burrow 0.4.4-beta.3 Kindle inversion and ornament repair'
          git push origin HEAD:${GITHUB_REF_NAME}
