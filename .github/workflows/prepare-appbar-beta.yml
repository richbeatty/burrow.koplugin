name: Prepare appbar icon beta

on:
  push:
    branches:
      - agent/0.4.5-beta.1-appbar-icons
    paths:
      - '.github/burrow-release/appbar-icons.tar.gz.b64'
      - '.github/workflows/prepare-appbar-beta.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.4.5-beta.1-appbar-icons
          fetch-depth: 0

      - name: Restore uploaded appbar icons
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/burrow-release/appbar-icons.tar.gz.b64 > /tmp/appbar-icons.tar.gz
          echo '1081e5cdc885f0852a6fdacc63948091fef7cf14d5c54041cc3186d244b59ba6  /tmp/appbar-icons.tar.gz' | sha256sum -c -
          tar -xzf /tmp/appbar-icons.tar.gz -C plugins/burrow.koplugin/icons
          cat > /tmp/appbar.sha256 <<'EOF'
          aa5823431d85261c2eae4909816e0cd73c7554a62297a3f760ae70ed51478f27  plugins/burrow.koplugin/icons/appbar.contrast.svg
          68c624745da6ff11a8221055d03942369cc00280b8032c8924c2da750df6538c  plugins/burrow.koplugin/icons/appbar.crop.svg
          e58bc193eaa243d48dd9369fb0e7b870a3da055c0bbcc64e41dda8ae6cfce599  plugins/burrow.koplugin/icons/appbar.filebrowser.svg
          172834dbf313cf386114d4b543ba5423ce728c417694f615db38ba55f0ebe392  plugins/burrow.koplugin/icons/appbar.menu.svg
          86bd1ca6772b6bfed26b37de6ec551378387718699373a9d0a1f97df030adc63  plugins/burrow.koplugin/icons/appbar.navigation.svg
          562099329047a8a6cb6f4a083c704264d076d43446dfeb17ffc871c9daefd3af  plugins/burrow.koplugin/icons/appbar.pageview.svg
          49073fab685cdf2133c914e3c26eb5ec234abedb94d869bdf57487113b8caa9f  plugins/burrow.koplugin/icons/appbar.rotation.svg
          ff425fe90390f0066b179b8069fb5cda92f9f7e81e971b2a6ea85d1aba81c203  plugins/burrow.koplugin/icons/appbar.search.svg
          4b31fd038419ba4a26be00d4522f94a9c940bc9e418aa997ea7dffe6599d60f3  plugins/burrow.koplugin/icons/appbar.settings.svg
          525357df0995f013639974edce57d7154e98bc123ac562033541c0f74d5cb8dd  plugins/burrow.koplugin/icons/appbar.textsize.svg
          44af510d9a61514c6446455ae0a947cdd28735ab736579774567cd9cf2a8f4dc  plugins/burrow.koplugin/icons/appbar.tools.svg
          e7a884c76d761ce1ec71310d15c7d8a21e254884e129dac8c57bf11505465f1f  plugins/burrow.koplugin/icons/appbar.typeset.svg
          EOF
          sed -i 's/^          //' /tmp/appbar.sha256
          sha256sum -c /tmp/appbar.sha256

      - name: Make fresh-install icon lookup immediate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('plugins/burrow.koplugin/burrow_util.lua')
          text = path.read_text()
          old = '''    if copied_any then
                  -- IconWidget caches resolved paths when first required. Clearing these
                  -- two module entries lets later Burrow modules see newly installed icons.
                  package.loaded["ui/widget/iconwidget"] = nil
                  package.loaded["ui/widget/iconbutton"] = nil
              end
          '''
          new = '''    if copied_any then
                  -- KOReader builds its user-icon search list when IconWidget is first
                  -- required. On a clean Burrow install the user icons directory may not
                  -- exist yet at that point. Patch the already-loaded IconWidget class so
                  -- future widgets immediately prefer the newly installed user icons.
                  -- This also bypasses any stock icon path cached earlier in the session.
                  local IconWidget = package.loaded["ui/widget/iconwidget"]
                  if type(IconWidget) == "table"
                      and type(IconWidget.init) == "function"
                      and not IconWidget._burrow_user_icon_lookup then
                      local original_icon_init = IconWidget.init
                      function IconWidget:init(...)
                          if not self.image and not self.file and type(self.icon) == "string" then
                              local svg = target_dir .. "/" .. self.icon .. ".svg"
                              if lfs.attributes(svg, "mode") == "file" then
                                  self.file = svg
                                  return
                              end
                              local png = target_dir .. "/" .. self.icon .. ".png"
                              if lfs.attributes(png, "mode") == "file" then
                                  self.file = png
                                  return
                              end
                          end
                          return original_icon_init(self, ...)
                      end
                      IconWidget._burrow_user_icon_lookup = true
                  end
              end
          '''
          if old not in text:
              raise SystemExit('installIcons cache block not found')
          path.write_text(text.replace(old, new, 1))

          version_path = Path('plugins/burrow.koplugin/burrow_version.lua')
          version = version_path.read_text()
          if 'VERSION = "0.4.4"' not in version or 'DISPLAY_VERSION = "0.4.4"' not in version:
              raise SystemExit('unexpected Burrow base version')
          version = version.replace('VERSION = "0.4.4"', 'VERSION = "0.4.5-beta.1"', 1)
          version = version.replace('DISPLAY_VERSION = "0.4.4"', 'DISPLAY_VERSION = "0.4.5-beta.1"', 1)
          version_path.write_text(version)

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text()
          marker = '## [Unreleased]\n'
          entry = '''## [Unreleased]\n\n## [0.4.5-beta.1] - 2026-08-16\n\n### Fixed\n\n- Restored the custom Burrow app-bar icon set used by older installations.\n- Made newly installed user icons available to KOReader during the same first session instead of requiring an extra restart.\n'''
          if marker not in changelog:
              raise SystemExit('Unreleased changelog marker not found')
          changelog_path.write_text(changelog.replace(marker, entry, 1))
          PY

      - name: Verify intended beta tree
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'VERSION = "0.4.5-beta.1"' plugins/burrow.koplugin/burrow_version.lua
          grep -F '_burrow_user_icon_lookup' plugins/burrow.koplugin/burrow_util.lua
          test "$(find plugins/burrow.koplugin/icons -maxdepth 1 -name 'appbar.*.svg' | wc -l)" -eq 12

      - name: Remove temporary recovery files and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/burrow-release/appbar-icons.tar.gz.b64
          rm -f .github/workflows/prepare-appbar-beta.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Burrow 0.4.5-beta.1 restore appbar icons'
          git push origin HEAD:agent/0.4.5-beta.1-appbar-icons
