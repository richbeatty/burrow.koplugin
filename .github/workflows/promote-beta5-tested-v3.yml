name: Promote tested beta.5 source

on:
  push:
    branches:
      - agent/0.4.4-beta.5-spine-priority

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.4.4-beta.5-spine-priority
          fetch-depth: 0
      - name: Reconstruct Android-tested v3 files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .burrow-promote/soft.b64 | gzip -d > /tmp/soft.diff
          base64 -d .burrow-promote/orn.b64 | gzip -d > /tmp/orn.diff
          patch -p1 < /tmp/soft.diff
          patch -p1 < /tmp/orn.diff
          python3 - <<'PY2'
          from pathlib import Path
          p = Path('plugins/burrow.koplugin/burrow_version.lua')
          s = p.read_text()
          s2 = s.replace('0.4.4-beta.4', '0.4.4-beta.5')
          if s2 == s or s2.count('0.4.4-beta.5') != 2:
              raise SystemExit('Version bump did not match expected beta.4 file')
          p.write_text(s2)
          PY2
          test "$(git hash-object plugins/burrow.koplugin/burrow_soft_palette_epub.lua)" = "355ef24aec8b90da96ba4e97a6730bdff494dce0"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua)" = "b9e346e12f2ad88795c6ca66f068086ee9d19a81"
          rm -rf .burrow-promote
          rm .github/workflows/promote-beta5-tested-v3.yml
          git diff --check
      - name: Commit tested beta.5 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Burrow 0.4.4-beta.5 spine-priority ornament performance"
          git push origin HEAD:agent/0.4.4-beta.5-spine-priority
