name: Finalize Burrow 0.4.4-beta.2

on:
  push:
    branches:
      - agent/0.4.4-beta.2-kindle-night-fix

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Guard beta.1 base and staged files
        shell: bash
        run: |
          set -euo pipefail
          BASE=8788a954f19aed91dfd12b691aad7abf0b1c38bd
          git merge-base --is-ancestor "$BASE" HEAD
          EXPECTED=$(printf '%s\n' \
            .github/beta442/part1 \
            .github/beta442/part2 \
            .github/beta442/part3 \
            .github/beta442/part4 \
            .github/beta442/part5 \
            .github/beta442/part6 \
            .github/workflows/__beta442-finalize.yml | sort)
          test "$(git diff --name-only "$BASE" HEAD | sort)" = "$EXPECTED"

      - name: Verify and reconstruct reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          echo 'ddb7bc6edf9c99e19c14891eeb69d7ce88aee0c7fb3ee63a7717ab649572aad0  .github/beta442/part1' | sha256sum -c -
          echo '45f46fc7e2b8e0c22a5f2dadf9c53a26462b8dc58418dd1a6e8d8bacf1a04904  .github/beta442/part2' | sha256sum -c -
          echo '29c5082674de62b595ac33ba30a9f1d4c4604d449dd3106c2785ee11232a7dcf  .github/beta442/part3' | sha256sum -c -
          echo 'ad96f6b100d1eabc6ae0b6c4d859da82ba1e2e7c37fbd1d7aaba52903ad037b8  .github/beta442/part4' | sha256sum -c -
          echo 'aaf85d2f47c27ee2df79c476f74c76d6cf93ee2dc9b33959b4a6809e6c074e20  .github/beta442/part5' | sha256sum -c -
          echo 'ce1d3c715f31056dfe9a08ecd944a3d92ca1e69d220d3aeed139e2e734e72429  .github/beta442/part6' | sha256sum -c -
          cat .github/beta442/part1 .github/beta442/part2 .github/beta442/part3 .github/beta442/part4 .github/beta442/part5 .github/beta442/part6 | base64 -d > /tmp/beta442.tar.gz
          echo '6ac2c24d7512cf837373bf106e680a4be0e901abfd4ffbcaf3788c94685a9493  /tmp/beta442.tar.gz' | sha256sum -c -
          tar -xzf /tmp/beta442.tar.gz
          rm -rf .github/beta442
          rm .github/workflows/__beta442-finalize.yml

      - name: Verify exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          BASE=8788a954f19aed91dfd12b691aad7abf0b1c38bd
          EXPECTED=$(printf '%s\n' \
            plugins/burrow.koplugin/burrow_soft_palette_epub.lua \
            plugins/burrow.koplugin/burrow_version.lua \
            plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua \
            plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua | sort)
          test "$(git diff --name-only "$BASE" | sort)" = "$EXPECTED"
          test "$(git hash-object plugins/burrow.koplugin/burrow_soft_palette_epub.lua)" = '913c1d6256bdac0b7b1201ebe3fa8599ae2870ea'
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua)" = 'dad142168ba67dc518fc06d12135b1e548451ede'
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua)" = '0c382b6aa30e862eb9598fe262f6f170549c77a3'
          test "$(git hash-object plugins/burrow.koplugin/burrow_version.lua)" = '765a0f51021ea6312b5f71d396404eab0b5bde52'
          ! grep -q 'DeviceListener' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          ! grep -q 'reloadDocument' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          ! grep -q 'setNightmodeImages' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          ! grep -q 'UIManager' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          ! grep -q 'pure-night\|soft-night' plugins/burrow.koplugin/burrow_soft_palette_epub.lua
          grep -q 'VERSION = "0.4.4-beta.2"' plugins/burrow.koplugin/burrow_version.lua
          git diff --check "$BASE"

      - name: Commit exact beta.2 candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Burrow 0.4.4-beta.2 Kindle night-mode repair'
          git push
