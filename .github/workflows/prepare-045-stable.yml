name: Prepare Burrow 0.4.5 stable metadata

on:
  push:
    branches:
      - agent/promote-0.4.5-stable
    paths:
      - '.github/workflows/prepare-045-stable.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/promote-0.4.5-stable
      - name: Convert beta changelog heading to stable
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^## \[0\.4\.5-beta\.1\] - 2026-08-16$/## [0.4.5] - 2026-08-16/' CHANGELOG.md
          rm -f .github/workflows/prepare-045-stable.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .github/workflows/prepare-045-stable.yml
          git commit -m "Prepare Burrow 0.4.5 stable metadata"
          git push origin HEAD:agent/promote-0.4.5-stable
