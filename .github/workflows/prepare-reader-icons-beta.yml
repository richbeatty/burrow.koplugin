name: Prepare reader icons beta

on:
  push:
    branches:
      - agent/0.4.5-beta.1-reader-icons-clean

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Burrow reader toolbar icon beta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          quick = Path('plugins/burrow.koplugin/internal_patches/2-quick-settings.lua')
          text = quick.read_text()
          old = '''local original_reader_setUpdateItemTable = ReaderMenu.setUpdateItemTable
          function ReaderMenu:setUpdateItemTable()
              original_reader_setUpdateItemTable(self)
              if self.tab_item_table then addTabOnce(self.tab_item_table) end
          end
          '''
          new = '''-- Keep Burrow's reader-toolbar glyphs scoped to the Reader menu instead of
          -- overwriting KOReader's global appbar icon names. Reuse the same light,
          -- rounded 1.8-stroke family as Reader Controls so a fresh Burrow install
          -- has one coherent visual language while unrelated KOReader screens keep
          -- their own theme/user icons.
          local reader_tab_icon_map = {
              ["appbar.navigation"] = "quick_toc",
              ["appbar.typeset"] = "quick_text",
              ["appbar.settings"] = "burrow.reader.settings",
              ["appbar.tools"] = "burrow.reader.tools",
              ["appbar.search"] = "quick_search",
              ["appbar.filebrowser"] = "quick_library",
              ["appbar.menu"] = "quick_more",
          }

          local function applyReaderTabIcons(tab_table)
              for _, tab in ipairs(tab_table or {}) do
                  local replacement = reader_tab_icon_map[tab.icon]
                  if replacement then tab.icon = replacement end
              end
          end

          local original_reader_setUpdateItemTable = ReaderMenu.setUpdateItemTable
          function ReaderMenu:setUpdateItemTable()
              original_reader_setUpdateItemTable(self)
              if self.tab_item_table then
                  applyReaderTabIcons(self.tab_item_table)
                  addTabOnce(self.tab_item_table)
              end
          end
          '''
          if text.count(old) != 1:
              raise SystemExit('ReaderMenu hook target changed; refusing blind edit')
          quick.write_text(text.replace(old, new, 1))

          version = Path('plugins/burrow.koplugin/burrow_version.lua')
          v = version.read_text()
          v2 = v.replace('VERSION = "0.4.4"', 'VERSION = "0.4.5-beta.1"', 1)
          v2 = v2.replace('DISPLAY_VERSION = "0.4.4"', 'DISPLAY_VERSION = "0.4.5-beta.1"', 1)
          if v2 == v or 'VERSION = "0.4.5-beta.1"' not in v2 or 'DISPLAY_VERSION = "0.4.5-beta.1"' not in v2:
              raise SystemExit('Version target changed; refusing blind edit')
          version.write_text(v2)

          icons = Path('plugins/burrow.koplugin/icons')
          (icons / 'burrow.reader.settings.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4v5M6 13v7M12 4v10M12 18v2M18 4v2M18 10v10"/><circle cx="6" cy="11" r="2"/><circle cx="12" cy="16" r="2"/><circle cx="18" cy="8" r="2"/></g></svg>\n''')
          (icons / 'burrow.reader.tools.svg').write_text('''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="none" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.2a4 4 0 0 0-5.2 5.2L4 15.7 8.3 20l5.3-5.3a4 4 0 0 0 5.2-5.2l-2.7 2.7-4.3-4.3z"/><path d="m5.5 17.2 1.3 1.3"/></g></svg>\n''')

          changelog = Path('CHANGELOG.md')
          c = changelog.read_text()
          marker = '## [Unreleased]\n'
          entry = '''## [0.4.5-beta.1] - 2026-08-16\n\n### Changed\n\n- Replaced the stock Reader top-menu tab glyphs with Burrow-scoped icons that match the Reader Controls visual style without overwriting KOReader or user-theme appbar icons\n- Reused Burrow's existing Contents, Text, Search, Library, and More glyphs and added matching Settings and Tools glyphs\n\n'''
          if entry not in c:
              if marker not in c:
                  raise SystemExit('Changelog marker missing')
              c = c.replace(marker, marker + '\n' + entry, 1)
              changelog.write_text(c)
          PY

          rm .github/workflows/prepare-reader-icons-beta.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Burrow 0.4.5-beta.1 reader toolbar icons"
          git push
