name: Prepare beta.10 tested settings patch

on:
  push:
    branches:
      - agent/0.4.3-beta.10-appearance-crop
    paths:
      - '.github/workflows/temp-beta10-appearance-crop.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta.10 branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct tested beta.10 files
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Restore the exact beta.8 files used by the working recovery overlay.
          git show v0.4.3-beta.8:plugins/burrow.koplugin/main.lua \
            > plugins/burrow.koplugin/main.lua
          git show v0.4.3-beta.8:plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua \
            > plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua

          python3 - <<'PY'
          from pathlib import Path

          root = Path('plugins/burrow.koplugin')

          # 1. Core-owned crop toggle. This is the exact mechanism that worked on-device.
          p = root / 'burrow_library.lua'
          s = p.read_text()
          needle = '''    table.insert(sub_item_table, {\n        text = _("About Burrow"),\n'''
          block = '''    table.insert(sub_item_table, {\n        text = _("Crop sleep-screen book cover to fill"),\n        help_text = _("Scale the current book cover proportionally until the sleep screen is completely filled, then crop the excess from the edges without stretching it."),\n        _burrow_sleep_cover_crop_setting = true,\n        checked_func = function()\n            return G_reader_settings:isTrue("burrow_screensaver_crop_cover_to_fill")\n        end,\n        callback = function()\n            G_reader_settings:saveSetting(\n                "burrow_screensaver_crop_cover_to_fill",\n                not G_reader_settings:isTrue("burrow_screensaver_crop_cover_to_fill")\n            )\n            if type(G_reader_settings.flush) == "function" then\n                G_reader_settings:flush()\n            end\n        end,\n    })\n'''
          if needle not in s:
              raise SystemExit('burrow_library insertion point missing')
          if '_burrow_sleep_cover_crop_setting = true' not in s:
              s = s.replace(needle, block + needle, 1)
          p.write_text(s)

          # 2. Preserve that exact core item through the known-good cleanup layer.
          p = root / 'internal_patches/2-zz-burrow-settings-menu.lua'
          s = p.read_text()
          needle = '''        local store = findItem(old_items, _("Store")) or findItem(old_items, _("Store unavailable"))\n        append(clean_items, store)\n        append(clean_items, { text = _("Advanced"), sub_item_table = advanced_items })\n'''
          block = '''        local store = findItem(old_items, _("Store")) or findItem(old_items, _("Store unavailable"))\n        append(clean_items, store)\n\n        -- This setting is created by Burrow's core menu so it remains available\n        -- even if the later settings compositor is unavailable. Carry that exact\n        -- item into the cleaned menu instead of recreating or injecting it later.\n        local sleep_cover_crop\n        for _, item in ipairs(old_items) do\n            if type(item) == "table" and item._burrow_sleep_cover_crop_setting then\n                sleep_cover_crop = item\n                break\n            end\n        end\n        append(clean_items, sleep_cover_crop)\n\n        append(clean_items, { text = _("Advanced"), sub_item_table = advanced_items })\n'''
          if needle not in s:
              raise SystemExit('settings cleanup insertion point missing')
          s = s.replace(needle, block, 1)
          p.write_text(s)

          # 3. Move the proven core item under Appearance when the final compositor runs.
          # If this layer ever fails, the cleanup layer leaves the toggle visible at root.
          p = root / 'internal_patches/2-zzzz-soft-palette-settings.lua'
          s = p.read_text()
          needle = '''            table.insert(items, math.min(2, #items + 1), appearance)\n        end\n\n        if not has_reading then\n'''
          block = '''            table.insert(items, math.min(2, #items + 1), appearance)\n        end\n\n        -- The sleep-cover crop toggle is created by Burrow's core menu so it\n        -- remains available even if this final Appearance compositor fails.\n        -- When Appearance is available, move that exact proven item into it\n        -- instead of creating a second toggle or adding another menu wrapper.\n        local appearance_menu\n        local crop_index\n        for index, item in ipairs(items) do\n            if type(item) == "table" and item._burrow_soft_palette_appearance then\n                appearance_menu = item\n            elseif type(item) == "table" and item._burrow_sleep_cover_crop_setting then\n                crop_index = index\n            end\n        end\n\n        if appearance_menu\n            and crop_index\n            and type(appearance_menu.sub_item_table) == "table"\n        then\n            local crop_item = table.remove(items, crop_index)\n            local has_crop = false\n            for _, item in ipairs(appearance_menu.sub_item_table) do\n                if type(item) == "table" and item._burrow_sleep_cover_crop_setting then\n                    has_crop = true\n                    break\n                end\n            end\n            if not has_crop then\n                table.insert(appearance_menu.sub_item_table, crop_item)\n            end\n        end\n\n        if not has_reading then\n'''
          if needle not in s:
              raise SystemExit('Appearance move insertion point missing')
          s = s.replace(needle, block, 1)
          p.write_text(s)

          # 4. beta.10 version only. Keep all compatibility values unchanged.
          p = root / 'burrow_version.lua'
          s = p.read_text()
          s = s.replace('VERSION = "0.4.3-beta.9"', 'VERSION = "0.4.3-beta.10"', 1)
          s = s.replace('DISPLAY_VERSION = "0.4.3-beta.9"', 'DISPLAY_VERSION = "0.4.3-beta.10"', 1)
          p.write_text(s)
          PY

          # The beta.9 renderer-only crop module is already the desired tested file.
          grep -q 'function Module.apply()' plugins/burrow.koplugin/burrow_sleep_cover_crop.lua
          ! grep -q 'addToMainMenu' plugins/burrow.koplugin/burrow_sleep_cover_crop.lua
          grep -q '_burrow_sleep_cover_crop_setting = true' plugins/burrow.koplugin/burrow_library.lua
          grep -q 'local sleep_cover_crop' plugins/burrow.koplugin/internal_patches/2-zz-burrow-settings-menu.lua
          grep -q 'local appearance_menu' plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua
          grep -q '0.4.3-beta.10' plugins/burrow.koplugin/burrow_version.lua

          # Remove this one-shot workflow from the final beta.10 tree.
          rm .github/workflows/temp-beta10-appearance-crop.yml

      - name: Commit exact beta.10 patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Burrow 0.4.3-beta.10 tested crop setting placement"
          git push origin HEAD:agent/0.4.3-beta.10-appearance-crop
