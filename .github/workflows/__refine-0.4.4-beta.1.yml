name: Refine Burrow 0.4.4-beta.1 ornament mode hooks

on:
  push:
    branches:
      - agent/0.4.4-beta.1-selective-ornaments
    paths:
      - '.github/workflows/__refine-0.4.4-beta.1.yml'

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "0c93f93cc69de3ef630e0fd92bcd880c4a16b588"
          test "$(git merge-base HEAD origin/main)" = "0c93f93cc69de3ef630e0fd92bcd880c4a16b588"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua)" = "b1b88f3781c4a0786378a0d0f0f6d76f8329600c"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua)" = "3b51ff99274c8ecb4f559c44885769e2bbb015e0"
          test "$(git hash-object plugins/burrow.koplugin/burrow_soft_palette_epub.lua)" = "deb969b06e16e1693e85beed0129dc2cd8c9f0f4"

      - name: Replace unreliable event hook with state-owner hooks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              assert count == 1, f"{label}: expected 1 match, found {count}"
              return text.replace(old, new, 1)

          p = Path('plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              '''    local Blitbuffer = require("ffi/blitbuffer")\n    local CreDocument = require("document/credocument")\n    local OrnamentEpub = require("burrow_soft_palette_epub")\n    local Screen = require("device").screen\n    local logger = require("logger")\n\n''',
              '''    local Blitbuffer = require("ffi/blitbuffer")\n    local CreDocument = require("document/credocument")\n    local DeviceListener = require("device/devicelistener")\n    local OrnamentEpub = require("burrow_soft_palette_epub")\n    local Screen = require("device").screen\n    local UIManager = require("ui/uimanager")\n    local logger = require("logger")\n\n    local reload_pending = false\n\n    local function scheduleReloadIfToneChanged()\n        if reload_pending then return end\n        reload_pending = true\n\n        UIManager:tickAfterNext(function()\n            reload_pending = false\n\n            local ok_reader, ReaderUI = pcall(require, "apps/reader/readerui")\n            local reader = ok_reader and ReaderUI.instance or nil\n            local document = reader and reader.document or nil\n            if not document\n                or reader.tearing_down\n                or document._burrow_epub_ornaments_active ~= true\n            then\n                return\n            end\n\n            local wanted = desiredTone(document, Screen)\n            if wanted == document._burrow_epub_ornaments_tone\n                or type(reader.reloadDocument) ~= "function"\n            then\n                return\n            end\n\n            local ok_reload, reload_error = pcall(\n                reader.reloadDocument,\n                reader,\n                nil,\n                true\n            )\n            if not ok_reload then\n                logger.warn(\n                    "[Burrow ornaments] Could not reload after image-mode change",\n                    reload_error\n                )\n            end\n        end)\n    end\n\n    -- DeviceListener owns the actual Night Mode state transition. Wrapping the\n    -- state owner catches ToggleNightMode as well as SetNightMode, while leaving\n    -- KOReader's inversion implementation untouched.\n    if not DeviceListener._burrow_epub_ornament_night_hook_v1 then\n        DeviceListener._burrow_epub_ornament_night_hook_v1 = true\n        local originalToggleNightMode = DeviceListener.onToggleNightMode\n\n        function DeviceListener:onToggleNightMode(...)\n            local result = originalToggleNightMode(self, ...)\n            scheduleReloadIfToneChanged()\n            return result\n        end\n    end\n\n    -- ReaderTypeset ultimately changes this CreDocument flag through\n    -- setNightmodeImages(). Hook the state setter instead of listening for the\n    -- ToggleNightmodeImages event, which ReaderTypeset consumes before plugins\n    -- later in ReaderUI's child list can reliably see it.\n    if not CreDocument._burrow_epub_ornament_image_mode_hook_v1 then\n        CreDocument._burrow_epub_ornament_image_mode_hook_v1 = true\n        local originalSetNightmodeImages = CreDocument.setNightmodeImages\n\n        function CreDocument:setNightmodeImages(...)\n            local result = originalSetNightmodeImages(self, ...)\n            scheduleReloadIfToneChanged()\n            return result\n        end\n    end\n\n''',
              'mode owner hooks',
          )
          p.write_text(s, encoding='utf-8')

          p = Path('plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua')
          s = p.read_text(encoding='utf-8')
          s = replace_once(s, '    local logger = require("logger")\n', '', 'remove reload logger')
          start = '    local ornament_reload_pending = false\n'
          end = '    -- Clean duplicate Quick Settings button IDs left behind by older test\n'
          assert s.count(start) == 1 and s.count(end) == 1
          a = s.index(start)
          b = s.index(end, a)
          s = s[:a] + s[b:]
          assert 'function plugin:onToggleNightMode' not in s
          assert 'function plugin:onToggleNightmodeImages' not in s
          assert 'ornament_reload_pending' not in s
          p.write_text(s, encoding='utf-8')

          p = Path('plugins/burrow.koplugin/burrow_soft_palette_epub.lua')
          s = p.read_text(encoding='utf-8')
          s = replace_once(
              s,
              'logger.warn("[Burrow palette] Could not encode recolored ornament", write_err)',
              'logger.warn("[Burrow ornaments] Could not encode adjusted ornament", write_err)',
              'ornament encode log',
          )
          s = replace_once(
              s,
              'return false, "Could not finalize soft-palette EPUB cache: " .. tostring(err)',
              'return false, "Could not finalize decorative EPUB cache: " .. tostring(err)',
              'cache finalization wording',
          )
          p.write_text(s, encoding='utf-8')
          PYCODE

          rm .github/workflows/__refine-0.4.4-beta.1.yml

      - name: Revalidate entire candidate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1

          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find plugins/burrow.koplugin -type f -name '*.lua' -print0)
          git diff --check

          test ! -e .github/workflows/__refine-0.4.4-beta.1.yml
          grep -q 'DeviceListener._burrow_epub_ornament_night_hook_v1' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          grep -q 'function DeviceListener:onToggleNightMode' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          grep -q 'CreDocument._burrow_epub_ornament_image_mode_hook_v1' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          grep -q 'function CreDocument:setNightmodeImages' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          grep -q 'UIManager:tickAfterNext' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          ! grep -Eq 'ReaderMenu|FileManagerMenu|setUpdateItemTable|mergeAndSort' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          ! grep -q 'function plugin:onToggleNightmodeImages' plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua
          ! grep -q 'function plugin:onToggleNightMode' plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua

          python3 - <<'PYCODE'
          from pathlib import Path
          module = Path('plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua').read_text()
          assert module.index('local result = originalToggleNightMode(self, ...)') < module.index('scheduleReloadIfToneChanged()', module.index('function DeviceListener:onToggleNightMode'))
          assert module.index('local result = originalSetNightmodeImages(self, ...)') < module.index('scheduleReloadIfToneChanged()', module.index('function CreDocument:setNightmodeImages'))
          assert 'document._burrow_epub_ornaments_active ~= true' in module
          assert 'wanted == document._burrow_epub_ornaments_tone' in module
          assert 'reader.reloadDocument' in module
          PYCODE

          changed="$({ git diff --name-only origin/main; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            plugins/burrow.koplugin/burrow_settings.lua \
            plugins/burrow.koplugin/burrow_soft_palette_epub.lua \
            plugins/burrow.koplugin/burrow_version.lua \
            plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua \
            plugins/burrow.koplugin/internal_patches/2-soft-palette.lua \
            plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua | sort)"
          test "$changed" = "$expected"

      - name: Commit refined candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden 0.4.4-beta.1 ornament mode hooks"
          git push origin HEAD:agent/0.4.4-beta.1-selective-ornaments
