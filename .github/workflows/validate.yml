name: Validate Burrow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1

      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          test -f plugins/burrow.koplugin/main.lua
          test -f plugins/burrow.koplugin/_meta.lua
          test -f plugins/burrow.koplugin/burrow_loader.lua
          test -f plugins/burrow.koplugin/burrow_library.lua
          test -f plugins/burrow.koplugin/burrow_version.lua
          test -f LICENSE
          test -f NOTICE.md
          test -f README.md

      - name: Check Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find plugins/burrow.koplugin -type f -name '*.lua' -print0)

      - name: Reject runtime and personal files
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(settings|cache|history|books)(/|$)|\.sqlite3?$|crash\.log$|settings_reader\.lua$|burrow_store\.lua$|\.(ttf|otf|ttc)$'
          if find . -type f -not -path './.git/*' | grep -E "$forbidden"; then
            echo 'Forbidden runtime, personal, or font file found.' >&2
            exit 1
          fi

      - name: Scan public files for embedded credentials
        shell: python
        run: |
          from pathlib import Path
          import re
          import sys

          roots = [
              Path("plugins"),
              Path("README.md"),
              Path("INSTALL.txt"),
              Path("CHANGELOG.md"),
              Path("CONTRIBUTING.md"),
              Path("SECURITY.md"),
              Path("NOTICE.md"),
          ]
          ignored_suffixes = {".svg", ".png", ".jpg", ".jpeg", ".gif", ".zip"}
          patterns = [
              ("authorization header", re.compile(
                  r"Authorization:\s*(?:Basic|Bearer)\s+[A-Za-z0-9+/_.=-]{12,}",
                  re.IGNORECASE,
              )),
              ("password assignment", re.compile(
                  r"\bpassword\s*=\s*[\"'][^\"']+[\"']",
                  re.IGNORECASE,
              )),
              ("API key assignment", re.compile(
                  r"\bapi[_-]?key\s*=\s*[\"'][A-Za-z0-9_-]{12,}[\"']",
                  re.IGNORECASE,
              )),
              ("known token format", re.compile(
                  r"\b(?:ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AKIA[0-9A-Z]{16})\b"
              )),
              ("private key", re.compile(
                  r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"
              )),
          ]

          findings = []
          for root in roots:
              if not root.exists():
                  continue
              files = root.rglob("*") if root.is_dir() else [root]
              for path in files:
                  if not path.is_file() or path.suffix.lower() in ignored_suffixes:
                      continue
                  text = path.read_text(encoding="utf-8", errors="ignore")
                  for label, pattern in patterns:
                      if pattern.search(text):
                          findings.append(f"{path}: possible {label}")

          if findings:
              print("\n".join(findings))
              sys.exit("Possible embedded credential found. Review before merging.")
