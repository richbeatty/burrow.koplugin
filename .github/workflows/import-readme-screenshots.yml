name: Import README screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/screenshot-seed/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode screenshots and update README
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/screenshot-seed/READY
          mkdir -p docs/screenshots
          for name in library store reader; do
            cat .github/screenshot-seed/${name}.part* | base64 --decode > docs/screenshots/${name}.jpg
            file docs/screenshots/${name}.jpg | grep -q 'JPEG image data'
          done

          python3 <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          start = text.index('## Screenshots')
          end = text.index('## Features', start)
          section = '''## Screenshots

| Library | Store | Reader |
|:---:|:---:|:---:|
| <img src="docs/screenshots/library.jpg" alt="Burrow library" width="300"> | <img src="docs/screenshots/store.jpg" alt="Burrow Store" width="300"> | <img src="docs/screenshots/reader.jpg" alt="Burrow Reading Controls" width="300"> |

'''
          path.write_text(text[:start] + section + text[end:], encoding='utf-8')
          PY

          rm -rf .github/screenshot-seed

      - name: Commit screenshots
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots .github/screenshot-seed
          git commit -m "Add README screenshots"
          git push
