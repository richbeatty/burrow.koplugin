name: Prepare Burrow 0.4.4-beta.1 selective ornaments

on:
  push:
    branches:
      - agent/0.4.4-beta.1-selective-ornaments
    paths:
      - '.github/workflows/__prepare-0.4.4-beta.1.yml'

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out beta candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact stable base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          stable=0c93f93cc69de3ef630e0fd92bcd880c4a16b588
          test "$(git rev-parse origin/main)" = "$stable"
          test "$(git merge-base HEAD origin/main)" = "$stable"

          changed="$(git diff --name-only origin/main...HEAD | sort)"
          expected="$(printf '%s\n' \
            .github/__prepare-0.4.4-beta.1-a.py \
            .github/__prepare-0.4.4-beta.1-b.py \
            .github/workflows/__prepare-0.4.4-beta.1.yml | sort)"
          test "$changed" = "$expected"

          test "$(git hash-object plugins/burrow.koplugin/burrow_soft_palette_epub.lua)" = "6b4ab24035ab67dec91646cedd0b4bd6e6089a06"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-soft-palette.lua)" = "9906b219e9de1672879c16a3e62747373a39a273"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua)" = "aa6aa1cb17afb02225eed2093417633f68b1ac47"
          test "$(git hash-object plugins/burrow.koplugin/burrow_settings.lua)" = "07f80ba53b7a8b68cce95144128c8c18becc5f4a"
          test "$(git hash-object plugins/burrow.koplugin/burrow_version.lua)" = "6567b58b523df7a2f3ea4b555504d95ce42311cd"

      - name: Apply selective ornament changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/__prepare-0.4.4-beta.1-a.py
          python3 .github/__prepare-0.4.4-beta.1-b.py
          rm .github/__prepare-0.4.4-beta.1-a.py
          rm .github/__prepare-0.4.4-beta.1-b.py
          rm .github/workflows/__prepare-0.4.4-beta.1.yml

      - name: Validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y lua5.1

          while IFS= read -r -d '' file; do
            luac5.1 -p "$file"
          done < <(find plugins/burrow.koplugin -type f -name '*.lua' -print0)

          git diff --check

          test ! -e .github/__prepare-0.4.4-beta.1-a.py
          test ! -e .github/__prepare-0.4.4-beta.1-b.py
          test ! -e .github/workflows/__prepare-0.4.4-beta.1.yml
          test -f plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua
          grep -q 'VERSION = "0.4.4-beta.1"' plugins/burrow.koplugin/burrow_version.lua
          grep -q 'DISPLAY_VERSION = "0.4.4-beta.1"' plugins/burrow.koplugin/burrow_version.lua

          ! grep -q '_burrow_soft_palette_ornament_loader_v1' plugins/burrow.koplugin/internal_patches/2-soft-palette.lua
          ! grep -Eq 'ReaderMenu|FileManagerMenu|setUpdateItemTable|mergeAndSort|setNightmodeImages' plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua

          grep -q '\["pure-light"\]' plugins/burrow.koplugin/burrow_soft_palette_epub.lua
          grep -q '\["pure-night"\]' plugins/burrow.koplugin/burrow_soft_palette_epub.lua
          grep -q '\["soft-light"\]' plugins/burrow.koplugin/burrow_soft_palette_epub.lua
          grep -q '\["soft-night"\]' plugins/burrow.koplugin/burrow_soft_palette_epub.lua
          grep -q 'ornaments-v2-selective-night' plugins/burrow.koplugin/burrow_soft_palette_epub.lua
          grep -q 'properties:find("cover%-image")' plugins/burrow.koplugin/burrow_soft_palette_epub.lua
          grep -q 'path:lower():find("cover", 1, true)' plugins/burrow.koplugin/burrow_soft_palette_epub.lua

          python3 - <<'PYCODE'
          from pathlib import Path

          settings = Path('plugins/burrow.koplugin/burrow_settings.lua').read_text()
          ornaments = settings.index('add("epub_ornaments"')
          quick = settings.index('if self:isFeatureEnabled("quick_settings")')
          assert ornaments < quick

          menu = Path('plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua').read_text()
          start = menu.index('text = _("Recolor decorative book elements")')
          end = menu.index('                    },', start)
          ornament_region = menu[start:end]
          assert 'enabled_func = enabled' not in ornament_region
          assert '_burrow_epub_ornament_reader_context = true' in menu
          assert 'function plugin:onToggleNightMode' in menu
          assert 'function plugin:onToggleNightmodeImages' in menu
          assert 'UIManager:tickAfterNext' in menu

          transformer = Path('plugins/burrow.koplugin/burrow_soft_palette_epub.lua').read_text()
          unchanged = [
              'local MAX_RASTER_PIXELS = 220000',
              'local MAX_RASTER_DIMENSION = 1400',
              'local MAX_COMPRESSED_BYTES = 2 * 1024 * 1024',
              'local SAMPLE_TARGET = 6000',
              'local MAX_CHROMA = 18',
              'local MAX_COLORED_SAMPLE_FRACTION = 0.02',
              'local MIN_EXTREME_SAMPLE_FRACTION = 0.82',
              'local MIN_LIGHT_SAMPLE_FRACTION = 0.20',
              'local MIN_DARK_SAMPLE_FRACTION = 0.002',
          ]
          assert all(item in transformer for item in unchanged)

          palettes = {
              'pure-light': ((0,0,0),(255,255,255)),
              'pure-night': ((255,255,255),(0,0,0)),
              'soft-light': ((32,32,32),(242,242,240)),
              'soft-night': ((223,223,223),(13,13,15)),
          }
          for channel in range(3):
              assert palettes['pure-light'][0][channel] + palettes['pure-night'][0][channel] == 255
              assert palettes['pure-light'][1][channel] + palettes['pure-night'][1][channel] == 255
              assert palettes['soft-light'][0][channel] + palettes['soft-night'][0][channel] == 255
              assert palettes['soft-light'][1][channel] + palettes['soft-night'][1][channel] == 255

          def tone(night, native_image_preservation):
              return 'night' if night and native_image_preservation else 'light'
          assert tone(False, True) == 'light'
          assert tone(False, False) == 'light'
          assert tone(True, True) == 'night'
          assert tone(True, False) == 'light'
          PYCODE

          changed="$({ git diff --name-only origin/main; git ls-files --others --exclude-standard; } | sort -u)"
          expected="$(printf '%s\n' \
            plugins/burrow.koplugin/burrow_settings.lua \
            plugins/burrow.koplugin/burrow_soft_palette_epub.lua \
            plugins/burrow.koplugin/burrow_version.lua \
            plugins/burrow.koplugin/internal_patches/2-epub-ornaments.lua \
            plugins/burrow.koplugin/internal_patches/2-soft-palette.lua \
            plugins/burrow.koplugin/internal_patches/2-zzzz-soft-palette-settings.lua | sort)"
          test "$changed" = "$expected"

      - name: Commit verified beta candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Burrow 0.4.4-beta.1 selective dark-mode ornaments"
          git push origin HEAD:agent/0.4.4-beta.1-selective-ornaments
