name: Publish Burrow 0.3.7 beta

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/burrow-release/trigger-037
      - .github/workflows/publish-037.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply tested 0.3.7 changes
        shell: bash
        run: |
          set -euo pipefail
          cat .github/burrow-release/fixed.* | base64 -d > /tmp/burrow-037.tgz
          gzip -t /tmp/burrow-037.tgz
          tar -xzf /tmp/burrow-037.tgz

          python3 <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          version_path = Path("plugins/burrow.koplugin/burrow_version.lua")
          version = version_path.read_text()
          version = replace_once(version, 'VERSION = "0.3.7-test4"', 'VERSION = "0.3.7-beta"', "version")
          version = replace_once(version, 'DISPLAY_VERSION = "0.3.7 test 4"', 'DISPLAY_VERSION = "0.3.7 beta"', "display version")
          version_path.write_text(version)

          install_path = Path("INSTALL.txt")
          install = install_path.read_text()
          install = replace_once(install, "BURROW 0.3.6 BETA INSTALLATION", "BURROW 0.3.7 BETA INSTALLATION", "install version")
          install_path.write_text(install)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          entry = textwrap.dedent("""\
          ## [0.3.7-beta] - 2026-08-05

          ### Changed

          - Improved Store cover loading and short-term catalog caching
          - Reduced unnecessary cover-cache pruning and network requests
          - Refined the Home and Store footer spacing and active underline

          ### Fixed

          - Hid the return arrow while the Burrow Home and Store footer is active
          - Hid page indicators on single-page Store menus
          - Increased spacing between the Burrow icon and the first row of Store covers
          - Repaired and compacted the Store download queue at startup
          - Prevented duplicate queued downloads and removed completed direct downloads from the queue
          - Persisted cleared download queues immediately

          """)
          changelog = replace_once(changelog, "## [Unreleased]\n\n", "## [Unreleased]\n\n" + entry, "changelog entry")
          changelog = replace_once(
              changelog,
              "[Unreleased]: https://github.com/richbeatty/burrow.koplugin/compare/v0.3.6-beta...HEAD",
              "[Unreleased]: https://github.com/richbeatty/burrow.koplugin/compare/v0.3.7-beta...HEAD\n[0.3.7-beta]: https://github.com/richbeatty/burrow.koplugin/releases/tag/v0.3.7-beta",
              "changelog links",
          )
          changelog_path.write_text(changelog)
          PY

          rm -rf .github/burrow-release
          rm -f .github/workflows/publish-037.yml

      - name: Validate Lua syntax
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          find plugins/burrow.koplugin -type f -name '*.lua' -print0 | xargs -0 -n1 luac5.1 -p

      - name: Build release ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          cp -a plugins dist/stage/
          cp NOTICE.md dist/stage/
          (
            cd dist/stage
            find plugins NOTICE.md -type f -print0 | sort -z | xargs -0 sha256sum > FILES.sha256
            zip -qr ../Burrow-0.3.7-beta.zip plugins NOTICE.md FILES.sha256
          )
          sha256sum dist/Burrow-0.3.7-beta.zip > dist/Burrow-0.3.7-beta.zip.sha256

      - name: Commit release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish Burrow 0.3.7 beta"
          git push origin HEAD:main

      - name: Tag release
        shell: bash
        run: |
          set -euo pipefail
          git tag -a v0.3.7-beta -m "Burrow 0.3.7 beta"
          git push origin v0.3.7-beta

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v0.3.7-beta \
            dist/Burrow-0.3.7-beta.zip \
            dist/Burrow-0.3.7-beta.zip.sha256 \
            --title "Burrow 0.3.7 beta" \
            --prerelease \
            --notes-file - <<'EOF'
          Burrow 0.3.7 beta improves Store loading and caching, refines the Home and Store footer, hides single-page indicators and the unwanted return arrow, and repairs persistent or duplicate download-queue entries.

          Back up the KOReader data folder before upgrading. Replace the existing `plugins/burrow.koplugin` folder and fully restart KOReader.
          EOF
