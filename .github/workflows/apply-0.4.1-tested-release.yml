name: Apply Burrow 0.4.1 tested release

on:
  push:
    branches:
      - agent/release-0.4.1

permissions:
  contents: write

jobs:
  apply-tested-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/release-0.4.1
          fetch-depth: 0

      - name: Verify 0.4.0 base files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object plugins/burrow.koplugin/burrow_list_folder_covers.lua)" = "7b5566880d5313504cdf7dba1873366eedfcd001"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-a-burrow-simple-topbar.lua)" = "08c2f4e6b6e1b198f4358aaecf84ad463251da77"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-automatic-book-series.lua)" = "c3ea907ab8049b5c2a68df3dc6ee2e198abdd05d"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-rounded-folder-covers.lua)" = "5a8f13fafd161c8b25db425b904e200e8baf1e0e"
          test "$(git hash-object plugins/burrow.koplugin/burrow_version.lua)" = "f7aaa6390eafc7212120da0f1008bdcbd1caad22"
          test "$(git hash-object CHANGELOG.md)" = "ea96af07638526f47c142a467e63e65fa4f066c3"
          test ! -e plugins/burrow.koplugin/icons/burrow.home.svg

      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/burrow-0.4.1.patch.gz.b64 <<'PATCH64'
          
          PATCH64
          tr -d '[:space:]' < /tmp/burrow-0.4.1.patch.gz.b64 | base64 -d > /tmp/burrow-0.4.1.patch.gz
          echo "d3690e83745eefca9f57c37c15634552367841afd648d24d9bff5109002a245d  /tmp/burrow-0.4.1.patch.gz" | sha256sum -c -
          gunzip -c /tmp/burrow-0.4.1.patch.gz > /tmp/burrow-0.4.1.patch
          echo "95d8e96bf164e790e0c57702c47c4b4a092bc41dd7f2011f424d840c86cb6bcc  /tmp/burrow-0.4.1.patch" | sha256sum -c -
          git apply --check /tmp/burrow-0.4.1.patch
          git apply /tmp/burrow-0.4.1.patch

      - name: Verify exact 0.4.1 result
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object plugins/burrow.koplugin/burrow_list_folder_covers.lua)" = "ebf6d8b69ce2551c1842ef849e5dc9eb1a357a41"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-a-burrow-simple-topbar.lua)" = "b171c9980567af7b38e943d18f6dcaf61c8f0182"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-automatic-book-series.lua)" = "93d4ab1f936654b2bbda32340984736f7bf70c1b"
          test "$(git hash-object plugins/burrow.koplugin/internal_patches/2-rounded-folder-covers.lua)" = "2b487c06b825e7c5aaebe8ffbf574bec39916d90"
          test "$(git hash-object plugins/burrow.koplugin/burrow_version.lua)" = "4f073d054c1429fb0e295f3571e10e74eadd02be"
          test "$(git hash-object CHANGELOG.md)" = "579d7a357cbfb1be508b251ea965c0cc0ffc1466"
          test "$(git hash-object plugins/burrow.koplugin/icons/burrow.home.svg)" = "f970eab4d59136cdd170e3046eb26fb521e1bc05"

      - name: Commit tested release files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-0.4.1-tested-release.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Burrow 0.4.1"
          git push origin HEAD:agent/release-0.4.1
